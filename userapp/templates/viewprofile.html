{% extends 'userbase.html' %}
{% load static %}

{% block main %}

<div class="container-fluid mt-4">

    <div class="row">
        <div class="col-lg-10 mx-auto">

            <!-- Heading -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="text-primary fw-bold">
                    <i class="fa-solid fa-user"></i>
                    My Profile
                </h2>

                <a href="{% url 'userdash' %}" class="btn btn-secondary">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back Dashboard
                </a>

            </div>

            <!-- Success/Error Messages -->
            {% if messages %}
                {% for m in messages %}
                <div class="alert alert-success alert-dismissible fade show">
                    {{ m }}
                    <button class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}

            <!-- Profile Card -->
            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fa-solid fa-user-pen"></i>
                        Update Profile
                    </h4>
                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name</label>
                                <input
                                    type="text"
                                    name="name"
                                    value="{{ js.name }}"
                                    class="form-control"
                                    required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Father Name</label>
                                <input
                                    type="text"
                                    name="fathername"
                                    value="{{ js.fathername }}"
                                    class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Gender</label>

                                <select name="gender" class="form-select">

                                    <option value="Male" {% if js.gender == "Male" %}selected{% endif %}>Male</option>

                                    <option value="Female" {% if js.gender == "Female" %}selected{% endif %}>Female</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mobile No.</label>
                                <input
                                    type="text"
                                    name="contactno"
                                    value="{{ js.contactno }}"
                                    class="form-control">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email Address</label>

                                <input
                                    type="email"
                                    value="{{ js.emailaddress }}"
                                    class="form-control"
                                    readonly>

                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Qualification</label>

                                <input
                                    type="text"
                                    name="qualification"
                                    value="{{ js.qualification }}"
                                    class="form-control">

                            </div>

                            <div class="col-md-12 mb-3">

                                <label class="form-label">Address</label>

                                <textarea
                                    name="address"
                                    rows="4"
                                    class="form-control">{{ js.address }}</textarea>

                            </div>

                        </div>

                        <div class="text-center mt-4">

                            <button type="submit" class="btn btn-success px-5">

                                <i class="fa-solid fa-floppy-disk"></i>

                                Update Profile

                            </button>

                            <a href="{% url 'userdash' %}" class="btn btn-primary px-5 ms-2">

                                <i class="fa-solid fa-house"></i>

                                Dashboard

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
